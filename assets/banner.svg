<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07152b"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .pulse-line {
      stroke: #00f2fe;
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 5s linear infinite;
    }
    .radar-sweep {
      transform-origin: 1050px 150px;
      animation: rotate 8s linear infinite;
    }
    .node-pulse {
      animation: pulse 2s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="12" fill="url(#grid)"/>

  <!-- Dynamic / Animated Background Graphics (Behind text) -->
  <!-- Cyber Nodes & Network Connections -->
  <g opacity="0.3">
    <line x1="100" y1="50" x2="250" y2="120" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4"/>
    <line x1="250" y1="120" x2="180" y2="240" stroke="#00f2fe" stroke-width="1"/>
    <line x1="1050" y1="150" x2="920" y2="80" stroke="#00f2fe" stroke-width="1"/>
    <line x1="1050" y1="150" x2="950" y2="230" stroke="#00f2fe" stroke-width="1"/>
  </g>

  <!-- Radar Graphic on Right side -->
  <g transform="translate(100, 0)">
    <circle cx="950" cy="150" r="100" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <circle cx="950" cy="150" r="70" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <circle cx="950" cy="150" r="40" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <line x1="850" y1="150" x2="1050" y2="150" stroke="#1e3a8a" stroke-width="1" opacity="0.4"/>
    <line x1="950" y1="50" x2="950" y2="250" stroke="#1e3a8a" stroke-width="1" opacity="0.4"/>
    
    <!-- Rotating Sweep -->
    <g class="radar-sweep">
      <path d="M 950 150 L 1050 150 A 100 100 0 0 0 950 50 Z" fill="url(#glowGrad)" opacity="0.15"/>
      <line x1="950" y1="150" x2="1050" y2="150" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Dynamic Pulse Nodes -->
  <circle cx="100" cy="50" class="node-pulse" fill="#00f2fe"/>
  <circle cx="250" cy="120" class="node-pulse" fill="#38bdf8" style="animation-delay: 0.5s;"/>
  <circle cx="180" cy="240" class="node-pulse" fill="#00f2fe" style="animation-delay: 1s;"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#glowGrad)"/>

  <!-- Foreground Title and Subtitle Layer (Always Crisp & Visible) -->
  <g transform="translate(80, 0)">
    <!-- Security Shield Icon -->
    <g transform="translate(0, 75)" filter="url(#glow)">
      <path d="M 25 0 L 50 12 C 50 35 37 55 25 65 C 13 55 0 35 0 12 Z" fill="none" stroke="#00f2fe" stroke-width="3"/>
      <path d="M 25 10 L 40 18 C 40 33 30 47 25 54 C 20 47 10 33 10 18 Z" fill="#00f2fe" opacity="0.3"/>
      <!-- Lock Core -->
      <circle cx="25" cy="30" r="5" fill="#00f2fe"/>
      <path d="M 25 35 L 25 43" stroke="#00f2fe" stroke-width="3"/>
    </g>

    <!-- Main Title -->
    <text x="70" y="115" class="title">Awesome Cyber Threat Intelligence</text>
    
    <!-- Subtitle -->
    <text x="70" y="155" class="subtitle">Curated CTI Platforms, Threat Sharing, IOC Management &amp; Security Analytics</text>
    
    <!-- Tagline & Highlights -->
    <text x="70" y="195" class="tagline">🛡️ Open-Source Ecosystem &amp; Enterprise SaaS • STIX/TAXII • MISP • OpenCTI • Threat Graphs</text>

    <!-- Badges Preview Bar in Banner -->
    <g transform="translate(70, 220)">
      <rect x="0" y="0" width="140" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="70" y="16" font-family="Segoe UI, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="600">PRODUCTION READY</text>

      <rect x="155" y="0" width="120" height="24" rx="12" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
      <text x="215" y="16" font-family="Segoe UI, sans-serif" font-size="11" fill="#00f2fe" text-anchor="middle" font-weight="600">STIX 2.1 / TAXII</text>

      <rect x="285" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="350" y="16" font-family="Segoe UI, sans-serif" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="600">OPEN SOURCE &amp; SAAS</text>
    </g>
  </g>
</svg>
